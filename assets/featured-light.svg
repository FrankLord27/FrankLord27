<text x="72" y="178" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#4338ca">Un comando convierte una máquina nueva en una</text>
<text x="72" y="204" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a">instalación de Claude Code completa y segura.</text>
<g class="st st0"><rect x="72" y="226" width="132" height="76" rx="16" fill="#ffffff" fill-opacity="0.85" stroke="#c7d2fe" stroke-opacity="0.5"/><text x="92" y="266" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#num)">13</text><text x="92" y="290" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#4338ca">agents</text></g><g class="st st1"><rect x="220" y="226" width="132" height="76" rx="16" fill="#ffffff" fill-opacity="0.85" stroke="#c7d2fe" stroke-opacity="0.5"/><text x="240" y="266" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#num)">29</text><text x="240" y="290" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#4338ca">skills</text></g><g class="st st2"><rect x="368" y="226" width="132" height="76" rx="16" fill="#ffffff" fill-opacity="0.85" stroke="#c7d2fe" stroke-opacity="0.5"/><text x="388" y="266" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#num)">6</text><text x="388" y="290" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#4338ca">hooks</text></g><g class="st st3"><rect x="516" y="226" width="132" height="76" rx="16" fill="#ffffff" fill-opacity="0.85" stroke="#c7d2fe" stroke-opacity="0.5"/><text x="536" y="266" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#num)">3</text><text x="536" y="290" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#4338ca">modos</text></g>
