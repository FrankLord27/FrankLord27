<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="392" viewBox="0 0 1280 392" role="img" aria-label="Proyecto destacado: ai-lordkit, un comando convierte una máquina nueva en una instalación de Claude Code completa y segura" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>

.orbA{animation:floatA 14s ease-in-out infinite}
.orbB{animation:floatB 18s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(-90px,50px)}}
@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,-40px)}}

.border{stroke-dasharray:240 3020;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-3260}}
.ring1{transform-origin:1030px 196px;animation:spin 18s linear infinite}
.ring2{transform-origin:1030px 196px;animation:spin 26s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-origin:1030px 196px;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.25);opacity:0}}
.st{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.st0{animation-delay:0.0s}.st1{animation-delay:0.25s}.st2{animation-delay:0.5s}.st3{animation-delay:0.75s}
.arrow{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="0.55" stop-color="#eef2ff"/><stop offset="1" stop-color="#fdf4ff"/></linearGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#312e81" stroke-opacity="0.06"/></pattern>
<clipPath id="card"><rect width="1280" height="392" rx="24"/></clipPath>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.18"/></filter>
<linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#f59e0b"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="392" fill="url(#bg)"/>
<rect width="1280" height="392" fill="url(#grid)"/>
<g class="orbA"><circle cx="1060" cy="40" r="300" fill="url(#g1)"/></g>
<g class="orbB"><circle cx="140" cy="412" r="260" fill="url(#g2)"/></g>
</g>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
<linearGradient id="num" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
