<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Frank Félix Rodríguez: desarrollador fullstack en República Dominicana, creador de ai-lordkit" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>

.orbA{animation:floatA 14s ease-in-out infinite}
.orbB{animation:floatB 18s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(-90px,50px)}}
@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,-40px)}}

.r0{opacity:0;animation:role 12s ease-in-out infinite;animation-delay:0.0s}.r1{opacity:0;animation:role 12s ease-in-out infinite;animation-delay:4.0s}.r2{opacity:0;animation:role 12s ease-in-out infinite;animation-delay:8.0s}
