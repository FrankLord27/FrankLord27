.dot{animation:dot 2s ease-in-out infinite}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.35}}
.wave{transform-origin:86px 70px;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.cv0{animation:cv0 14s steps(6) infinite}@keyframes cv0{0%,2%{transform:translateX(0)}12%,100%{transform:translateX(70px)}}.cur0{animation:cur0 14s linear infinite}@keyframes cur0{0%,1%{opacity:0}2%,15%{opacity:1}16%,100%{opacity:0}}.o1{opacity:0;animation:o1 14s linear infinite}@keyframes o1{0%,14%{opacity:0}15%,100%{opacity:1}}.cv2{animation:cv2 14s steps(13) infinite}@keyframes cv2{0%,20%{transform:translateX(0)}31%,100%{transform:translateX(137px)}}.cur2{animation:cur2 14s linear infinite}@keyframes cur2{0%,19%{opacity:0}20%,34%{opacity:1}35%,100%{opacity:0}}.o3{opacity:0;animation:o3 14s linear infinite}@keyframes o3{0%,33%{opacity:0}34%,100%{opacity:1}}.cv4{animation:cv4 14s steps(18) infinite}@keyframes cv4{0%,39%{transform:translateX(0)}52%,100%{transform:translateX(185px)}}.cur4{animation:cur4 14s linear infinite}@keyframes cur4{0%,38%{opacity:0}39%,55%{opacity:1}56%,100%{opacity:0}}.o5{opacity:0;animation:o5 14s linear infinite}@keyframes o5{0%,55%{opacity:0}56%,100%{opacity:1}}.o6{opacity:0;animation:o6 14s linear infinite}@keyframes o6{0%,59%{opacity:0}60%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.r0{opacity:1}
@media (prefers-reduced-motion: reduce){.r1,.r2{opacity:0}.cv0,.cv2,.cv4{transform:translateX(600px)}[class^=o]{opacity:1}}
</style>
