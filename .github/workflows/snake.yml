# Genera la animación de la culebrita con las contribuciones y la publica en la rama "output".
name: snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#ea580c&color_dots=#ebedf0,#ddd6fe,#a78bfa,#7c3aed,#4c1d95
            dist/snake-dark.svg?palette=github-dark&color_snake=#f59e0b&color_dots=#161b22,#3b1a6e,#6d28d9,#a855f7,#e9d5ff

      - name: Publicar en la rama output
        env:
          REPO: ${{ github.repository }}
          GH_PUSH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # dist/ lo crea el contenedor como root: se publica desde una carpeta propia.
          out="$RUNNER_TEMP/snake-out"
          mkdir -p "$out"
          cp dist/snake-light.svg dist/snake-dark.svg "$out"/
          cd "$out"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake-light.svg snake-dark.svg
          git commit -q -m "chore: actualiza la culebrita de contribuciones"
          git push -q --force "https://x-access-token:${GH_PUSH}@github.com/${REPO}.git" output
